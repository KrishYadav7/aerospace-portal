plugins {
    id 'com.android.application'
}

/* ---- settings from ../app.properties (or the APP_URL environment variable) ---- */
def appProps = new Properties()
def propsFile = rootProject.file('app.properties')
if (propsFile.exists()) propsFile.withInputStream { appProps.load(it) }
def appUrl = (System.getenv('APP_URL') ?: appProps.getProperty('APP_URL', '')).trim()
if (!appUrl.startsWith('https://')) {
    throw new GradleException('Set APP_URL=https://your-domain/app in android-app/app.properties')
}
def appHost = new URI(appUrl).host
/* first page on launch — the landing page (same site as APP_URL) */
def startUrl = (System.getenv('START_URL') ?: appProps.getProperty('START_URL', '')).trim()
if (!startUrl) startUrl = "https://${appHost}/"

/* ---- AeroGyan Office: OFFICE_SLUG=<slug> builds that Office app instead of the main app ----
   Own package tech.aerogyan.office.<slug>, name + icons from android-app/office/<slug>/res
   (made by office/make-office-res.py), opens https://<host>/apps/<slug>/, direct APK only.
   Without OFFICE_SLUG nothing below changes the main app. */
def officeSlug = (System.getenv('OFFICE_SLUG') ?: '').trim().toLowerCase()
if (officeSlug) {
    if (!(officeSlug ==~ /[a-z][a-z0-9]{0,31}/)) {
        throw new GradleException("OFFICE_SLUG '${officeSlug}' must be lowercase letters/digits (it becomes part of the package name)")
    }
    if (!rootProject.file("office/${officeSlug}/res/values/strings.xml").exists()) {
        throw new GradleException("No Office app '${officeSlug}': android-app/office/${officeSlug}/res is missing (run android-app/office/make-office-res.py)")
    }
    appUrl = "https://${appHost}/apps/${officeSlug}/".toString()
    startUrl = appUrl
}
/* ---- AeroGyan Office pack: OFFICE_PACK=<id> builds ONE APK with every app of that pack ----
   Package tech.aerogyan.pack.<id>, name "AeroGyan for Professors" …; one launcher icon (own label,
   icon and task) per app, all from android-app/office/pack-<id>/ (res, AndroidManifest.xml, java —
   made by office/make-office-res.py). Each opens https://<host>/apps/<slug>/; one WebView storage,
   so one sign-in covers them all. Direct APK only. */
def officePack = (System.getenv('OFFICE_PACK') ?: '').trim().toLowerCase()
if (officePack) {
    if (officeSlug) throw new GradleException('Set OFFICE_SLUG or OFFICE_PACK, not both')
    if (!(officePack ==~ /[a-z][a-z0-9]{0,31}/)) {
        throw new GradleException("OFFICE_PACK '${officePack}' must be lowercase letters/digits (it becomes part of the package name)")
    }
    if (!rootProject.file("office/pack-${officePack}/AndroidManifest.xml").exists()) {
        throw new GradleException("No Office pack '${officePack}': android-app/office/pack-${officePack} is missing (run android-app/office/make-office-res.py)")
    }
    appUrl = "https://${appHost}/apps/".toString()      // each app's own page comes from its activity (meta-data slug)
    startUrl = appUrl
}
if (!startUrl.startsWith('https://') || new URI(startUrl).host != appHost) {
    throw new GradleException('START_URL must be an https page on the same site as APP_URL')
}

/* ---- version: the cloud build passes the build number ---- */
def vCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()
def vName = System.getenv('VERSION_NAME') ?: "1.0.${vCode}"

android {
    namespace 'tech.aerogyan.app'
    compileSdk 36

    defaultConfig {
        applicationId officePack ? "tech.aerogyan.pack.${officePack}"
                : officeSlug ? "tech.aerogyan.office.${officeSlug}" : 'tech.aerogyan.app'
        minSdk 24
        targetSdk 36
        versionCode vCode
        versionName vName
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
        buildConfigField 'String', 'START_URL', "\"${startUrl}\""
        buildConfigField 'String', 'OFFICE_SLUG', "\"${officeSlug}\""
        buildConfigField 'String', 'OFFICE_PACK', "\"${officePack}\""
        manifestPlaceholders = [appHost: appHost, officeSlug: officeSlug]
    }

    buildFeatures {
        buildConfig true
    }

    /* Two versions of the same app (same package and signing key):
       • direct — the APK students download from aerogyan.tech (offers its own updates)
       • play   — the Google Play build (.aab): updates only through Play, no buying in the app */
    flavorDimensions 'store'
    productFlavors {
        direct {
            dimension 'store'
            buildConfigField 'String', 'STORE', '"direct"'
        }
        play {
            dimension 'store'
            buildConfigField 'String', 'STORE', '"play"'
        }
    }

    /* an Office app: its own name, icons and link rules on top of the main app */
    if (officeSlug) {
        sourceSets {
            direct {
                res.srcDirs = [rootProject.file("office/${officeSlug}/res")]
                manifest.srcFile 'src/office/AndroidManifest.xml'
            }
        }
    }
    /* a pack: the pack's name and icons + one icon per app, its launcher activities, their classes */
    if (officePack) {
        sourceSets {
            direct {
                res.srcDirs = [rootProject.file("office/pack-${officePack}/res")]
                manifest.srcFile rootProject.file("office/pack-${officePack}/AndroidManifest.xml")
                java.srcDir rootProject.file("office/pack-${officePack}/java")
            }
        }
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

/* Office apps and packs are website APKs only — no Google Play build */
androidComponents {
    beforeVariants(selector().withFlavor(new kotlin.Pair('store', 'play'))) { variantBuilder ->
        if (officeSlug || officePack) variantBuilder.enable = false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'      // FileProvider (camera photos for uploads)
}
