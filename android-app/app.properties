# ============================================================
#  AeroGyan Android app — settings used when the APK is built
# ============================================================
# The website the app opens (must be https). Students land on the
# login page; links to this domain stay inside the app.
APP_URL=https://aerogyan.tech/app
# The page shown first when the app opens: the sign-in screen (with
# its Notes tab). Since 2026-10-23 the landing page also sends the app
# here, so older builds behave the same.
START_URL=https://aerogyan.tech/app
