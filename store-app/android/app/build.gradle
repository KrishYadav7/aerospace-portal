plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

/* ============================================================
   AeroGyan Store (tech.aerogyan.store) — the Android store for our own apps.
   Version: store-app/VERSION (X.Y.Z) or VERSION_NAME; versionCode = X*10000 + Y*100 + Z
   (the server's rule too: backend/internal/media/storerelease.go storeVersionCode).
   Signed release: KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (the store's own key,
   ~/.aerogyan-store-keys/ and the STORE_* GitHub secrets — never committed).
   ============================================================ */
def versionFile = rootProject.file('../VERSION')
def vName = (System.getenv('VERSION_NAME') ?: (versionFile.exists() ? versionFile.text.trim() : '1.0.0')).trim()
def vm = (vName =~ /^(\d+)\.(\d+)\.(\d+)$/)
if (!vm.matches()) throw new GradleException("store-app/VERSION must be X.Y.Z, not '${vName}'")
def vMajor = vm.group(1).toInteger(), vMinor = vm.group(2).toInteger(), vPatch = vm.group(3).toInteger()
if (vMinor > 99 || vPatch > 99) throw new GradleException('minor and patch must be below 100 (versionCode = X*10000 + Y*100 + Z)')
def vCode = vMajor * 10000 + vMinor * 100 + vPatch

/* Package visibility: every app the store can offer is named in <queries> (no QUERY_ALL_PACKAGES).
   The Office apps and packs come from office/apps.json (store-app/android/../../office/apps.json in both the
   website repo — legacy-node/office — and the CI repo — office/); written into a generated manifest that is
   merged into every build. */
def appsJson = rootProject.file('../../office/apps.json')
if (!appsJson.exists()) throw new GradleException("office/apps.json not found at ${appsJson} — the store must list every Office package in <queries>")
def office = new groovy.json.JsonSlurper().parse(appsJson)
def queriesDir = new File(buildDir, 'generated/queries')
queriesDir.mkdirs()
def q = new StringBuilder()
q << '<?xml version="1.0" encoding="utf-8"?>\n'
q << '<!-- generated by app/build.gradle from office/apps.json — do not edit -->\n'
q << '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <queries>\n'
office.apps.each { a -> q << "        <package android:name=\"tech.aerogyan.office.${a.slug}\" />\n" }
(office.packs ?: []).each { p -> q << "        <package android:name=\"tech.aerogyan.pack.${p.id}\" />\n" }
q << '    </queries>\n</manifest>\n'
def queriesManifest = new File(queriesDir, 'AndroidManifest.xml')
queriesManifest.text = q.toString()

android {
    namespace 'tech.aerogyan.store'
    compileSdk 36

    defaultConfig {
        applicationId 'tech.aerogyan.store'
        minSdk 26
        targetSdk 36
        versionCode vCode
        versionName vName
        buildConfigField 'String', 'STORE_BASE', "\"${System.getenv('STORE_BASE') ?: 'https://aerogyan.tech'}\""
        buildConfigField 'int', 'OFFICE_APPS', "${office.apps.size()}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resourceConfigurations += ['en', 'hi']      // only our two languages (AndroidX brings 80+)
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    sourceSets {
        debug.manifest.srcFile queriesManifest
        release.manifest.srcFile queriesManifest
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/versions/9/previous-compilation-data.bin']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.06.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.1'
    implementation 'androidx.work:work-runtime-ktx:2.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'           // the real org.json for JVM tests (android.jar has stubs)
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.work:work-testing:2.10.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
