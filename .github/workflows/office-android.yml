# ============================================================
#  AeroGyan Office — the 12 Android apps (signed APKs) in the cloud.
#  Runs when android-app/ or office/ changes on branch office-apps, or by hand:
#  GitHub → Actions → "Office apps — Android" → Run workflow.
#
#  One job per app in office/apps.json (OFFICE_SLUG=<slug>, see
#  android-app/app/build.gradle), plus one job that builds the main
#  AeroGyan app unchanged (not published) to prove it still builds.
#  Result: ONE Release office-android-v1.0.<run> with 12 files
#  AeroGyan-<Short>-1.0.<run>.apk (Short = the name without "AeroGyan "
#  and spaces: Sheets, AISolver, PlacementPrep …). The website's
#  Admin → Apps → Office → "Publish latest from GitHub" takes them.
#
#  Signing: the same 4 secrets as android-apk.yml (same key as the main
#  app, so ANDROID_ID — and the device slot — is shared on a phone).
# ============================================================
name: Office apps — Android

on:
  workflow_dispatch:
  push:
    branches: [office-apps]
    paths:
      - 'android-app/**'
      - 'office/**'
      - '.github/workflows/office-android.yml'

permissions:
  contents: write

concurrency:
  group: office-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apps:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the app list (office/apps.json)
        id: list
        run: |
          SLUGS=$(jq -c '[.apps[].slug]' office/apps.json)
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "Apps: $SLUGS ($(jq '.apps | length' office/apps.json))"

  main-app:
    name: main app still builds (not published)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build the main app without OFFICE_SLUG (unsigned)
        working-directory: android-app
        env:
          VERSION_CODE: '999'
        run: gradle assembleDirectRelease bundlePlayRelease --no-daemon
      - name: Check it is the main app
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          APK=$(ls android-app/app/build/outputs/apk/direct/release/*.apk | head -1)
          B=$("$AAPT2" dump badging "$APK")
          grep -E "^(package|application-label|launchable-activity|application-icon-480)" <<<"$B"
          grep -q "^package: name='tech.aerogyan.app'" <<<"$B" || { echo "::error::main app package changed"; exit 1; }
          grep -q "^application-label:'AeroGyan'" <<<"$B" || { echo "::error::main app label changed"; exit 1; }
          ls -l android-app/app/build/outputs/bundle/playRelease/

  build:
    needs: apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slug: ${{ fromJson(needs.apps.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Signing secrets are missing (same 4 as android-apk.yml)."
            exit 1
          fi

      - name: File name for ${{ matrix.slug }}
        id: meta
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re
          slug = os.environ['SLUG']
          a = next(x for x in json.load(open('office/apps.json'))['apps'] if x['slug'] == slug)
          short = re.sub(r'[^A-Za-z0-9]', '', re.sub(r'^AeroGyan\s+', '', a['name'])) or slug
          print('short=' + short)
          print('name=' + a['name'])
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore the signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK (${{ matrix.slug }})
        working-directory: android-app
        env:
          OFFICE_SLUG: ${{ matrix.slug }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDirectRelease --no-daemon --stacktrace

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Name + check the APK
        id: apk
        env:
          SLUG: ${{ matrix.slug }}
          OUT: AeroGyan-${{ steps.meta.outputs.short }}-1.0.${{ github.run_number }}.apk
          RUN: ${{ github.run_number }}
        run: |
          mkdir -p out
          cp android-app/app/build/outputs/apk/direct/release/app-direct-release.apk "out/$OUT"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          B=$("${BT}aapt2" dump badging "out/$OUT")
          grep -E "^(package|sdkVersion|targetSdkVersion|application-label|application-icon-|launchable-activity|uses-permission)" <<<"$B"
          grep -q "^package: name='tech.aerogyan.office.$SLUG' versionCode='$RUN' versionName='1.0.$RUN'" <<<"$B" \
            || { echo "::error::wrong package / version in $OUT"; exit 1; }
          grep -q "^application-icon-" <<<"$B" || { echo "::error::no launcher icon"; exit 1; }
          "${BT}apksigner" verify --print-certs "out/$OUT" | grep -E "Signer #1 certificate (DN|SHA-256)"
          ls -l "out/$OUT"
          sha256sum "out/$OUT"
          echo "::notice title=$SLUG::$OUT $(stat -c %s "out/$OUT") bytes — $(grep -oE "^application-label:'[^']*'" <<<"$B")"

      - uses: actions/upload-artifact@v4
        with:
          name: office-android-${{ matrix.slug }}
          path: out/*.apk
          retention-days: 30

  publish:
    needs: [apps, build, main-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: office-android-*
          path: release
          merge-multiple: true

      - name: All apps built?
        id: files
        env:
          SLUGS: ${{ needs.apps.outputs.slugs }}
        run: |
          ls -l release
          N=$(ls release/*.apk | wc -l)
          WANT=$(echo "$SLUGS" | jq length)
          echo "count=$N" >> "$GITHUB_OUTPUT"
          [ "$N" -eq "$WANT" ] || { echo "::error::$N APKs for $WANT apps"; exit 1; }
          {
            echo 'sums<<EOF'
            (cd release && sha256sum *.apk)
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: office-android-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: AeroGyan Office Android 1.0.${{ github.run_number }}
          make_latest: false
          body: |
            Signed Android apps of AeroGyan Office (${{ steps.files.outputs.count }} apps), package tech.aerogyan.office.<slug>.
            Publish them on the website: Admin → Apps → Office → "Publish latest from GitHub".

            SHA-256:
            ```
            ${{ steps.files.outputs.sums }}
            ```
          files: release/*.apk

      - name: Keep only the newest 5 Office Android releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" -L 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("office-android-v"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r t; do echo "deleting old $t"; gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done
