<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AeroGyan Logo Generator</title>
  <style>
    body { font-family: Inter, -apple-system, sans-serif; background: #0b1226; color: #fff; padding: 40px 20px; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 26px; margin-bottom: 8px; }
    p { color: #b8bdd1; margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: #131832; border: 1px solid #262f5a; border-radius: 14px; padding: 20px; text-align: center; }
    .card h3 { font-size: 13px; margin-bottom: 12px; color: #a5b4fc; }
    .card canvas { background: #05060e; border-radius: 12px; display: block; margin: 0 auto 14px; }
    .card .name { font-size: 11px; color: #7b82a3; font-family: monospace; margin-bottom: 10px; }
    button { background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff; border: none; padding: 9px 18px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; width: 100%; }
    button:hover { background: linear-gradient(135deg, #4338ca, #4f46e5); }
    .bulk { background: linear-gradient(135deg, #10b981, #34d399); color: #062a1e; padding: 16px 28px; font-size: 15px; max-width: 320px; margin: 0 auto; display: block; }
    .preview-lg { background: #131832; border: 1px solid #262f5a; border-radius: 14px; padding: 30px; text-align: center; margin-bottom: 30px; }
    .preview-lg canvas { border-radius: 20px; box-shadow: 0 20px 60px rgba(79, 70, 229, .3); }
  </style>
</head>
<body>
  <h1>🎨 AeroGyan Logo Generator</h1>
  <p>Saari PNG sizes automatically generate hongi. "Download All" click karo.</p>
  <div class="preview-lg"><canvas id="preview" width="220" height="220"></canvas></div>
  <div class="grid" id="grid"></div>
  <button class="bulk" onclick="downloadAll()">📦 Download All Sizes</button>

  <script>
    const SVG_SOURCE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AeroGyan Education"><title>AeroGyan Education</title><rect width="512" height="512" rx="112" fill="#FFFFFF"/><svg x="75.5" y="41" width="361" height="430" viewBox="0 0 1080 1287"><path fill="#020C45" fill-rule="evenodd" d="M540 0L1080 836L810 772L540 1286L270 772L0 836ZM540 193L180 772L360 740L540 1093L720 740L900 772Z"/><path fill="#1800AD" d="M540 386L721 708L540 900L360 708Z"/></svg></svg>`;
    const SIZES = [
      { size: 16,  name: 'favicon-16.png' },
      { size: 32,  name: 'favicon-32.png' },
      { size: 48,  name: 'favicon-48.png' },
      { size: 96,  name: 'favicon-96.png' },
      { size: 180, name: 'apple-touch-icon.png' },
      { size: 192, name: 'icon-192.png' },
      { size: 256, name: 'icon-256.png' },
      { size: 384, name: 'icon-384.png' },
      { size: 512, name: 'icon-512.png' }
    ];

    const grid = document.getElementById('grid');
    const previewCanvas = document.getElementById('preview');
    const svgBlob = new Blob([SVG_SOURCE], { type: 'image/svg+xml;charset=utf-8' });
    const svgUrl = URL.createObjectURL(svgBlob);
    const img = new Image();

    img.onload = () => {
      drawTo(previewCanvas, 220);
      SIZES.forEach(s => createCard(s));
    };
    img.src = svgUrl;

    function drawTo(canvas, size) {
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(img, 0, 0, size, size);
    }

    function createCard(s) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<h3>${s.size} × ${s.size}</h3><canvas id="c-${s.size}" width="${Math.min(s.size, 140)}" height="${Math.min(s.size, 140)}"></canvas><div class="name">${s.name}</div><button onclick="download(${s.size}, '${s.name}')">⬇ Download</button>`;
      grid.appendChild(card);
      const previewSize = Math.min(s.size, 140);
      const c = document.getElementById('c-' + s.size);
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, previewSize, previewSize);
    }

    function download(size, filename) {
      const c = document.createElement('canvas');
      drawTo(c, size);
      c.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
      }, 'image/png');
    }

    async function downloadAll() {
      for (const s of SIZES) {
        download(s.size, s.name);
        await new Promise(r => setTimeout(r, 350));
      }
    }
  </script>
</body>
</html>
